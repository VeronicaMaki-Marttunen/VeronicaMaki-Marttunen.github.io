# Site Information
title: "Verónica Mäki-Marttunen's Research"
author: "Verónica Mäki-Marttunen"
description: "I am a neuroscientist passionate about how the activity we measure in our brain is so variable and spiky and at the same time encodes our rich experience and lets us interact with our environment."
lang: "en"
date_format: "%B %d, %Y"
keywords: slow brain dynamics, brain modulation, and behavior
# Permalink Configuration
permalink: /:title/
excerpt_separator: "\n\n\n"

# Layout Options
show_excerpts: false             # Show article excerpts instead of an archive list on the home page
show_frame: true                 # Display a grey frame on large screens
show_sidebar: false               # Show a sidebar instead of the usual header
show_minimal: false              # Remove all clutter

# Menu Configuration
navigation:                     # Accepts {file, title, url, icon, sidebaricon}
  - {file: "research.md", title: "Research"} # , sidebaricon: home
  - {file: "teaching.md", title: "Teaching"} 
  - {file: "cv.md", title: "CV"} # , sidebaricon: address-card
  - {file: "blog.md", title: "Blog", sidebaricon: home}

external:                       # Accepts {file, title, url, icon, sidebaricon}
  - {title: "Mail", icon: "envelope", url: "mailto:veroniex@uio.no"}
  - {title: "GitHub", icon: "github", url: "https://github.com/VeronicaMaki-Marttunen"}
  - {title: "LinkedIn", icon: "rss", url: "https://www.linkedin.com/in/veronicamaekimarttunen/"}

# Comments Configuration
comments:
